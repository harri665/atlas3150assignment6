# The site as a Portainer stack on TrueNAS, served at
# atlas3150A6.harrison-martin.com (the proxy points there at port 41537)
services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: atlas3150a6-client
    ports:
      - "41537:80"
    restart: unless-stopped
